name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for common secret formats
        shell: bash
        run: |
          if git grep -nI -E -- \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}' \
            -- ':!*.example' ':!pnpm-lock.yaml'; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate local infrastructure configuration
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml config --quiet

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
