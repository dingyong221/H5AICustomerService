name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/platform-provisioning

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate release policy and scan for common secrets
        run: node scripts/quality/release-gate.mjs static --version 0.1.0

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate local infrastructure configuration
        shell: bash
        env:
          H5CS_RUNTIME_ENV_FILE: ${{ github.workspace }}/.env.example
          H5CS_MERCHANT_ENV_FILE: ${{ github.workspace }}/.env.example
          H5CS_OPS_ENV_FILE: ${{ github.workspace }}/.env.example
        run: |
          docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml config --quiet
          docker compose --env-file infra/compose/release.env.example --file infra/compose/docker-compose.release.yml config --quiet

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate SBOM and repository release evidence
        run: node scripts/quality/release-gate.mjs evidence --version 0.1.0 --output "${{ runner.temp }}/release-evidence"

      - name: Verify release evidence integrity
        run: node scripts/quality/release-gate.mjs verify --version 0.1.0 --evidence "${{ runner.temp }}/release-evidence"

      - name: Upload repository release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 14

  mysql-integration:
    name: Real MySQL merchant-to-consumer flow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      H5CS_MYSQL_DATABASE: h5cs_integration_ci
      H5CS_MYSQL_USER: h5cs_ci
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_INTEGRATION_MYSQL_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
      MYSQL_DATABASE_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start loopback-only disposable MySQL
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql

      - name: Apply reviewed MySQL migrations
        run: pnpm --filter @h5cs/database exec drizzle-kit migrate --config drizzle.config.ts

      - name: Build API and workspace dependencies
        run: pnpm exec turbo run build --filter=@h5cs/api --concurrency=1

      - name: Verify merchant-to-consumer persistence and public API
        run: pnpm --filter @h5cs/api test:integration

      - name: Stop disposable MySQL
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down

  browser-e2e:
    name: Browser operator-to-consumer flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      H5CS_MYSQL_DATABASE: h5cs_integration_ci
      H5CS_MYSQL_USER: h5cs_ci
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_INTEGRATION_MYSQL_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
      MYSQL_DATABASE_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start loopback-only disposable MySQL
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql

      - name: Apply reviewed MySQL migrations
        run: pnpm --filter @h5cs/database exec drizzle-kit migrate --config drizzle.config.ts

      - name: Build API, Worker and workspace dependencies
        run: pnpm exec turbo run build --filter=@h5cs/api --filter=@h5cs/worker --concurrency=1

      - name: Install Chromium for isolated browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify operator, merchant and consumer browser workflow
        run: pnpm test:e2e

      - name: Stop disposable MySQL
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down
