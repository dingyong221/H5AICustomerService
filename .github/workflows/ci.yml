name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/offline-knowledge-quality-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate release policy and scan for common secrets
        run: node scripts/quality/release-gate.mjs static --version 0.1.0

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate local infrastructure configuration
        shell: bash
        env:
          H5CS_API_ENV_FILE: ${{ github.workspace }}/infra/compose/api.env.example
          H5CS_WORKER_ENV_FILE: ${{ github.workspace }}/infra/compose/worker.env.example
          H5CS_MODEL_API_KEY_HOST_FILE: ${{ github.workspace }}/infra/compose/worker.env.example
          H5CS_PREVIEW_AUTH_TOKEN_HOST_FILE: ${{ github.workspace }}/infra/compose/worker.env.example
          H5CS_MIGRATION_URL_HOST_FILE: ${{ github.workspace }}/infra/compose/api.env.example
          H5CS_MIGRATION_BACKUP_REF: ci-validation-only
          H5CS_MIGRATION_CHANGE_ID: ci-validation-only
          H5CS_MIGRATION_PLAN_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          H5CS_MERCHANT_ENV_FILE: ${{ github.workspace }}/infra/compose/merchant-web.env.example
          H5CS_OPS_ENV_FILE: ${{ github.workspace }}/infra/compose/ops-web.env.example
        run: |
          docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml config --quiet
          docker compose --env-file infra/compose/release.env.example --file infra/compose/docker-compose.release.yml config --quiet
          docker compose --env-file infra/compose/release.env.example --file infra/compose/docker-compose.release.yml --file infra/compose/docker-compose.release.model-secret.yml config --quiet
          docker compose --env-file infra/compose/release.env.example --file infra/compose/docker-compose.release.yml --file infra/compose/docker-compose.release.model-secret.yml --file infra/compose/docker-compose.release.preview-auth.yml config --quiet
          docker compose --env-file infra/compose/release.env.example --file infra/compose/docker-compose.release.yml --file infra/compose/docker-compose.release.single-node-mysql.yml --file infra/compose/docker-compose.release.migration.single-node-mysql.yml --profile migration config --quiet

      - name: Validate candidate single-domain Nginx syntax and routing
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          bash scripts/quality/verify-nginx-single-domain.sh
          bash scripts/quality/verify-nginx-routing.sh

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify optional same-domain Web path builds
        shell: bash
        env:
          NEXT_PUBLIC_MERCHANT_BASE_PATH: /console
          NEXT_PUBLIC_OPS_BASE_PATH: /ops
        run: |
          set -euo pipefail
          # Merchant tenant pages intentionally use root-level /{merchantId} routes.
          # /console is an asset/compatibility prefix, unlike the Ops Next basePath.
          for spec in 'merchant-web /console 3133 /console/account/login /account/login 200' 'ops-web /ops 3134 /ops/login /login 404'; do
            read -r app prefix port live_path root_path root_status <<< "$spec"
            pnpm --filter "@h5cs/${app}" build
            (
              cd "apps/${app}"
              pnpm exec next start -p "$port" >/dev/null 2>&1 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' EXIT
              for attempt in {1..40}; do
                if curl --silent --output /dev/null "http://127.0.0.1:${port}${live_path}"; then break; fi
                sleep 1
              done
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}${live_path}")" = 200
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}${root_path}")" = "$root_status"
              html="$(curl --silent "http://127.0.0.1:${port}${live_path}")"
              grep -Fq "src=\"${prefix}/_next/static/" <<< "$html"
            )
          done

      - name: Generate SBOM and repository release evidence
        run: node scripts/quality/release-gate.mjs evidence --version 0.1.0 --output "${{ runner.temp }}/release-evidence"

      - name: Verify release evidence integrity
        run: node scripts/quality/release-gate.mjs verify --version 0.1.0 --evidence "${{ runner.temp }}/release-evidence"

      - name: Upload repository release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 14

  mysql-integration:
    name: Real MySQL merchant-to-consumer flow
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/offline-knowledge-quality-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      H5CS_MYSQL_DATABASE: h5cs_integration_ci
      H5CS_MYSQL_USER: h5cs_ci
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_INTEGRATION_MYSQL_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
      MYSQL_DATABASE_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start loopback-only disposable MySQL
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql

      - name: Verify non-empty twelve-to-thirteen schema upgrade and replay
        run: node packages/database/scripts/verify-ci-upgrade.mjs --run

      - name: Apply reviewed MySQL migrations
        run: pnpm --filter @h5cs/database exec drizzle-kit migrate --config drizzle.config.ts

      - name: Build API and workspace dependencies
        run: pnpm exec turbo run build --filter=@h5cs/api --concurrency=1

      - name: Verify merchant-to-consumer persistence and public API
        run: pnpm --filter @h5cs/api test:integration

      - name: Drill non-empty logical backup and isolated restore
        run: bash scripts/quality/verify-ci-mysql-restore.sh

      - name: Stop disposable MySQL
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down

  browser-e2e:
    name: Browser operator-to-consumer flow
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/offline-knowledge-quality-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      H5CS_MYSQL_DATABASE: h5cs_integration_ci
      H5CS_MYSQL_USER: h5cs_ci
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_INTEGRATION_MYSQL_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
      MYSQL_DATABASE_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start loopback-only disposable MySQL
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql

      - name: Apply reviewed MySQL migrations
        run: pnpm --filter @h5cs/database exec drizzle-kit migrate --config drizzle.config.ts

      - name: Build API, Worker and the three production Web apps
        run: pnpm exec turbo run build --filter=@h5cs/api --filter=@h5cs/worker --filter=@h5cs/ops-web --filter=@h5cs/merchant-web --filter=@h5cs/consumer-h5 --concurrency=1

      - name: Install Chromium for isolated browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production-build operator, merchant and consumer browser workflow
        run: pnpm test:e2e

      - name: Build prefixed management Web variants
        env:
          NEXT_PUBLIC_MERCHANT_BASE_PATH: /console
          NEXT_PUBLIC_OPS_BASE_PATH: /ops
        run: |
          pnpm --filter @h5cs/merchant-web build
          pnpm --filter @h5cs/ops-web build

      - name: Verify full browser workflow under prefixed management paths
        env:
          H5CS_E2E_PATH_MODE: subpaths
          NEXT_PUBLIC_MERCHANT_BASE_PATH: /console
          NEXT_PUBLIC_OPS_BASE_PATH: /ops
        run: pnpm test:e2e

      - name: Verify full browser workflow on one origin
        env:
          H5CS_E2E_PATH_MODE: single_domain
          NEXT_PUBLIC_MERCHANT_BASE_PATH: /console
          NEXT_PUBLIC_OPS_BASE_PATH: /ops
        run: pnpm test:e2e

      - name: Upload isolated operator reporting screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-reporting-browser-${{ github.sha }}
          path: artifacts/ops-enhancement
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable MySQL
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down

  image-packaging:
    name: Build five release container targets
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/offline-knowledge-quality-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      H5CS_MYSQL_DATABASE: h5cs_integration_ci
      H5CS_MYSQL_USER: h5cs_ci
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_INTEGRATION_MYSQL_URL: mysql://h5cs_ci:local-dev-ci-only@127.0.0.1:3306/h5cs_integration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24 for runtime probes
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Build image targets without publishing
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'api api' 'worker worker' 'web merchant-web' 'web consumer-h5' 'web ops-web'; do
            read -r kind name <<< "$spec"
            docker build \
              --file infra/docker/workspace.Dockerfile \
              --target "$kind" \
              --build-arg "APP_KIND=$kind" \
              --build-arg "APP_NAME=$name" \
              --tag "h5cs-$name:ci" \
              .
            docker image inspect "h5cs-$name:ci" \
              --format 'image={{.RepoTags}} user={{.Config.User}} command={{.Config.Cmd}}'
          done

      - name: Smoke packaged runtime under release restrictions
        run: bash scripts/quality/smoke-release-images.sh

      - name: Reclaim disposable builder cache before path variants
        shell: bash
        run: |
          set -euo pipefail
          # Only the disposable job's build cache. Preserve all tagged runtime
          # images; do not prune containers, database volumes or host resources.
          docker builder prune --all --force
          docker image inspect h5cs-api:ci h5cs-worker:ci h5cs-merchant-web:ci h5cs-consumer-h5:ci h5cs-ops-web:ci >/dev/null
          df -h /

      - name: Build and smoke same-domain management image variants without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file infra/docker/workspace.Dockerfile \
            --target web \
            --build-arg APP_KIND=web \
            --build-arg APP_NAME=merchant-web \
            --build-arg NEXT_PUBLIC_MERCHANT_BASE_PATH=/console \
            --tag h5cs-merchant-web:ci \
            .
          H5CS_MERCHANT_BASE_PATH=/console bash scripts/quality/smoke-release-images.sh merchant-web
          docker build \
            --file infra/docker/workspace.Dockerfile \
            --target web \
            --build-arg APP_KIND=web \
            --build-arg APP_NAME=ops-web \
            --build-arg NEXT_PUBLIC_OPS_BASE_PATH=/ops \
            --tag h5cs-ops-web:ci \
            .
          H5CS_OPS_BASE_PATH=/ops bash scripts/quality/smoke-release-images.sh ops-web

      - name: Reclaim temporary builder cache before database runtime probes
        shell: bash
        run: |
          set -euo pipefail
          # All image builds are finished. Reclaim only this ephemeral runner's
          # builder cache; retain the tagged runtime images, containers and volumes.
          docker system df
          df -h /
          docker builder prune --all --force
          docker image inspect h5cs-api:ci h5cs-worker:ci >/dev/null
          docker system df
          df -h /

      - name: Start isolated loopback MySQL for packaged runtime probes
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql

      - name: Probe packaged API and Worker against real MySQL
        run: bash scripts/quality/smoke-release-images-db.sh

      - name: Stop isolated MySQL
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down

  offline-candidate-delivery:
    name: Verify and export the frozen merchant knowledge quality candidate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/offline-knowledge-quality-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Check out delivery tooling with the frozen application history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install locked pnpm for transport-only checks
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify transport-only changes before installing dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { assertTransportOnlyPaths, validatePlan } from './scripts/quality/candidate-offline-contract.mjs';
          const plan = validatePlan(JSON.parse(readFileSync('scripts/operations/r1-offline-delivery-plan.json', 'utf8')));
          if (execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== process.env.GITHUB_SHA) throw new Error('TRANSPORT_CHECKOUT_MISMATCH');
          assertTransportOnlyPaths(execFileSync('git', ['diff', '--name-only', plan.sourceSha, 'HEAD', '--'], { encoding: 'utf8' }).trim().split(/\r?\n/u).filter(Boolean));
          NODE
      - name: Install frozen dependencies for transport formatting
        run: pnpm install --frozen-lockfile
      - name: Validate transport release policy and formatting
        run: |
          node scripts/quality/release-gate.mjs static --version 0.1.0
          pnpm exec prettier --check .github/workflows/ci.yml scripts/quality/candidate-offline-contract.mjs scripts/quality/candidate-offline-contract.test.mjs scripts/quality/export-candidate-offline.mjs scripts/operations/r1-offline-delivery-plan.json docs/operations/2026-10-17-offline-candidate-delivery.md
      - name: Verify offline delivery contracts without Docker or network
        run: node --test scripts/quality/candidate-offline-contract.test.mjs
      - name: Download the previously verified source digest manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-images-d34ad65b2c3b049fa6be4f4be944480a6eb2ee17
          run-id: 39818820017
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/h5cs-offline-source-manifest
      - name: Authenticate only this temporary runner to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Export and verify save remove load roundtrip for the same five images
        id: export
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/quality/export-candidate-offline.mjs --run
      - name: Reject a repeated export while preserving the loaded images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          H5CS_DELIVERY_DIRECTORY: ${{ steps.export.outputs.artifact_directory }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { assertLoadedImage, validateDeliveryManifest, validatePlan } from './scripts/quality/candidate-offline-contract.mjs';
          const fail = () => { throw new Error('PREEXISTING_IMAGE_PROTECTION_NOT_VERIFIED'); };
          const plan = validatePlan(JSON.parse(await readFile('scripts/operations/r1-offline-delivery-plan.json', 'utf8')));
          const delivery = validateDeliveryManifest(JSON.parse(await readFile(join(process.env.H5CS_DELIVERY_DIRECTORY, 'delivery.json'), 'utf8')), plan);
          const dockerEnvironment = Object.fromEntries(['PATH', 'HOME', 'USER', 'LANG', 'LC_ALL', 'DOCKER_CONFIG', 'TMPDIR', 'TEMP', 'TMP'].filter((key) => typeof process.env[key] === 'string').map((key) => [key, process.env[key]]));
          const docker = (args) => {
            const result = spawnSync('docker', args, { env: dockerEnvironment, encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024, shell: false });
            if (result.error || result.status !== 0) fail();
            return result.stdout;
          };
          const inventory = () => [...new Set(docker(['image', 'ls', '--no-trunc', '--quiet']).trim().split(/\r?\n/u).filter(Boolean))].sort().join('\n');
          const before = inventory();
          const rerun = spawnSync(process.execPath, ['scripts/quality/export-candidate-offline.mjs', '--run'], { env: process.env, encoding: 'utf8', timeout: 90000, maxBuffer: 1024 * 1024, shell: false });
          let stopped;
          try { stopped = JSON.parse(rerun.stderr.trim()); } catch { fail(); }
          if (rerun.error || rerun.status !== 1 || rerun.stdout.trim() !== '' || stopped.type !== 'stopped' || stopped.phase !== 'pull_exact_images' || stopped.code !== 'PREEXISTING_IMAGE_REFERENCE' || stopped.publicDeployment !== false) fail();
          if (inventory() !== before) fail();
          for (const record of delivery.images) {
            const inspected = JSON.parse(docker(['image', 'inspect', record.loadTag]));
            if (!Array.isArray(inspected) || inspected.length !== 1) fail();
            assertLoadedImage(inspected[0], record, plan);
          }
          process.stdout.write(`${JSON.stringify({ type: 'preexisting_images_preserved', imageCount: delivery.images.length, noNewImages: true, publicDeployment: false })}\n`);
          NODE
      - name: Upload bounded private delivery bundle for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-candidate-d34ad65b2c3b049fa6be4f4be944480a6eb2ee17
          path: ${{ steps.export.outputs.artifact_directory }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve private staging and production boundaries
        run: |
          echo 'The application images are still the frozen d34ad65 candidate.'
          echo 'Application CI and exact-image browser evidence are verified from the fixed source runs; this workflow checks transport only.'
          echo 'No server credential, database migration, or public traffic switch occurred.'
          echo 'Archive hashes and image config IDs are not a substitute for signed provenance or real-model acceptance.'
