name: Temporary H5 self-service image delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h5-self-service-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_SHA: 5f21958e41dbc9f6eac0f2fdef3bffdcb5512504
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build and smoke frozen five application images
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          for spec in 'api api' 'worker worker' 'web merchant-web' 'web consumer-h5' 'web ops-web'; do
            read -r kind name <<< "$spec"
            merchant=''; ops=''
            if [ "$name" = merchant-web ]; then merchant=/console; fi
            if [ "$name" = ops-web ]; then ops=/ops; fi
            docker build --platform linux/amd64 --file infra/docker/workspace.Dockerfile --target "$kind" \
              --build-arg "APP_KIND=$kind" --build-arg "APP_NAME=$name" \
              --build-arg NEXT_PUBLIC_APP_ENV=production --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 \
              --build-arg NEXT_PUBLIC_MERCHANT_API_BASE_URL=/api/v1 --build-arg NEXT_PUBLIC_PUBLIC_API_BASE_URL=/api/v1/public \
              --build-arg "NEXT_PUBLIC_MERCHANT_BASE_PATH=$merchant" --build-arg "NEXT_PUBLIC_OPS_BASE_PATH=$ops" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --label org.opencontainers.image.h5cs.web-path-mode=same_domain \
              --tag "h5cs-$name:ci" .
            H5CS_MERCHANT_BASE_PATH="$merchant" H5CS_OPS_BASE_PATH="$ops" bash scripts/quality/smoke-release-images.sh "$name"
          done
      - name: Export and round-trip immutable images
        env:
          DELIVERY_DIR: ${{ runner.temp }}/h5-self-service-delivery
        run: |
          set -euo pipefail
          mkdir -p "$DELIVERY_DIR"
          tags='h5cs-api:ci h5cs-worker:ci h5cs-merchant-web:ci h5cs-consumer-h5:ci h5cs-ops-web:ci'
          docker image inspect $tags > "$DELIVERY_DIR/images-before.json"
          docker save $tags | gzip -1 > "$DELIVERY_DIR/candidate-images.tar.gz"
          gzip -t "$DELIVERY_DIR/candidate-images.tar.gz"
          docker image rm $tags
          gzip -dc "$DELIVERY_DIR/candidate-images.tar.gz" | docker load
          python3 - <<'PY'
          import datetime,gzip,hashlib,json,os,pathlib,subprocess,tarfile
          out=pathlib.Path(os.environ['DELIVERY_DIR'])
          source=os.environ['SOURCE_SHA']
          apps=['api','worker','merchant-web','consumer-h5','ops-web']
          before=json.loads((out/'images-before.json').read_text())
          after=json.loads(subprocess.check_output(['docker','image','inspect']+['h5cs-'+a+':ci' for a in apps]))
          assert len(before)==len(after)==5
          images={}
          with tarfile.open(out/'candidate-images.tar.gz','r:gz') as bundle:
              manifest=json.load(bundle.extractfile('manifest.json'))
              assert len(manifest)==5
              for app,old,new in zip(apps,before,after):
                  assert old['Id']==new['Id'] and old['RootFS']==new['RootFS'] and old['Config']==new['Config']
                  assert old['Os']=='linux' and old['Architecture']=='amd64'
                  cfg=old['Config']
                  assert cfg['User']=='node' and cfg['WorkingDir']=='/app'
                  assert cfg['Labels']['org.opencontainers.image.revision']==source
                  assert cfg['Labels']['org.opencontainers.image.h5cs.web-path-mode']=='same_domain'
                  tag='h5cs-'+app+':ci'
                  entry=next(e for e in manifest if e['RepoTags']==[tag])
                  raw=bundle.extractfile(entry['Config']).read()
                  encoded=json.loads(raw)
                  assert encoded['rootfs']['diff_ids']==old['RootFS']['Layers']
                  for field in ['Labels','Cmd','Entrypoint','Env','ExposedPorts','User','Healthcheck','WorkingDir']:
                      assert encoded['config'].get(field)==cfg.get(field), field
                  images[app]={'tag':tag,'exportedId':old['Id'],'configDigest':'sha256:'+hashlib.sha256(raw).hexdigest(),'rootfs':old['RootFS']['Layers'],'config':cfg,'configPath':entry['Config'],'layerPaths':entry['Layers'],'size':old['Size']}
          archive=out/'candidate-images.tar.gz'
          h=hashlib.sha256()
          with archive.open('rb') as f:
              for block in iter(lambda:f.read(2097152),b''):h.update(block)
          tarbytes=0
          with gzip.open(archive,'rb') as f:
              for block in iter(lambda:f.read(2097152),b''):tarbytes+=len(block)
          result={'schemaVersion':1,'sourceSha':source,'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'pathMode':'same_domain','runId':os.environ['GITHUB_RUN_ID'],'workflowSha':os.environ['GITHUB_SHA'],'createdAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'images':images,'archive':{'file':archive.name,'sha256':h.hexdigest(),'bytes':archive.stat().st_size,'tarBytes':tarbytes},'smokePassed':True,'roundTripPassed':True,'attestationVerified':False,'productionDeployed':False}
          (out/'delivery.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'images-before.json').unlink()
          print(json.dumps({'source':source,'archive':result['archive'],'images':{k:v['configDigest'] for k,v in images.items()}}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h5-self-service-images-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/h5-self-service-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
