name: Temporary merchant management image transport

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-management-image-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-merchant-image:
    name: Build, smoke and export the exact merchant source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      SOURCE_SHA: 580d5050541919078c9419eb57670b7c68388b7b
      IMAGE_TAG: h5cs-merchant-web:ci

    steps:
      - name: Check out the frozen business source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source and build only the production merchant image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          docker build \
            --platform linux/amd64 \
            --file infra/docker/workspace.Dockerfile \
            --target web \
            --build-arg APP_KIND=web \
            --build-arg APP_NAME=merchant-web \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 \
            --build-arg NEXT_PUBLIC_MERCHANT_API_BASE_URL=/api/v1 \
            --build-arg NEXT_PUBLIC_PUBLIC_API_BASE_URL=/api/v1/public \
            --build-arg NEXT_PUBLIC_MERCHANT_BASE_PATH=/console \
            --build-arg NEXT_PUBLIC_MERCHANT_ASSET_PREFIX= \
            --build-arg NEXT_PUBLIC_OPS_BASE_PATH= \
            --label org.opencontainers.image.source=https://github.com/dingyong221/H5AICustomerService \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label org.opencontainers.image.h5cs.web-path-mode=same_domain \
            --tag "$IMAGE_TAG" \
            .

      - name: Smoke merchant runtime with the existing release restrictions
        shell: bash
        env:
          H5CS_MERCHANT_BASE_PATH: /console
        run: |
          set -euo pipefail
          bash scripts/quality/smoke-release-images.sh merchant-web

      - name: Save, round-trip and describe the single immutable image
        shell: bash
        env:
          DELIVERY_DIR: ${{ runner.temp }}/merchant-menu-delivery
        run: |
          set -euo pipefail
          mkdir -p "$DELIVERY_DIR"
          docker image inspect "$IMAGE_TAG" > "$RUNNER_TEMP/merchant-image-before.json"
          docker save "$IMAGE_TAG" | gzip -1 > "$DELIVERY_DIR/candidate-image.tar.gz"
          gzip -t "$DELIVERY_DIR/candidate-image.tar.gz"
          gzip -dc "$DELIVERY_DIR/candidate-image.tar.gz" | wc -c > "$RUNNER_TEMP/merchant-image-tar-bytes.txt"
          docker image rm "$IMAGE_TAG"
          if docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo 'Image tag unexpectedly remained after removal.' >&2
            exit 1
          fi
          gzip -dc "$DELIVERY_DIR/candidate-image.tar.gz" | docker load
          docker image inspect "$IMAGE_TAG" > "$RUNNER_TEMP/merchant-image-after.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tarfile
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['DELIVERY_DIR'])
          temporary = Path(os.environ['RUNNER_TEMP'])
          source = os.environ['SOURCE_SHA']
          tag = os.environ['IMAGE_TAG']
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          before = json.loads((temporary / 'merchant-image-before.json').read_text())[0]
          after = json.loads((temporary / 'merchant-image-after.json').read_text())[0]
          assert before['Id'] == after['Id'], 'Docker image identity changed in save/load round-trip'
          assert before['RootFS'] == after['RootFS'], 'Docker root filesystem changed in round-trip'
          assert before['Config'] == after['Config'], 'Docker runtime configuration changed in round-trip'
          assert before['Os'] == after['Os'] == 'linux'
          assert before['Architecture'] == after['Architecture'] == 'amd64'
          config = after['Config']
          assert config['Labels']['org.opencontainers.image.revision'] == source
          assert config['Labels']['org.opencontainers.image.h5cs.web-path-mode'] == 'same_domain'
          assert config['Labels']['org.opencontainers.image.source'] == 'https://github.com/dingyong221/H5AICustomerService'
          assert config['User'] == 'node'
          assert config['Cmd'] == ['node', 'node_modules/next/dist/bin/next', 'start']
          assert config['ExposedPorts'] == {'3000/tcp': {}}
          assert 'NEXT_PUBLIC_MERCHANT_BASE_PATH=/console' in config['Env']
          assert config.get('Healthcheck', {}).get('Test'), 'Runtime healthcheck missing'
          archive = output / 'candidate-image.tar.gz'
          archive_bytes = archive.stat().st_size
          tar_bytes = int((temporary / 'merchant-image-tar-bytes.txt').read_text().strip())
          assert 0 < archive_bytes <= 1073741824
          assert 0 < tar_bytes <= 2147483648
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          with tarfile.open(archive, mode='r:gz') as bundle:
              manifest = json.load(bundle.extractfile('manifest.json'))
              assert len(manifest) == 1, 'Archive must contain one image only'
              entry = manifest[0]
              assert entry['RepoTags'] == [tag]
              raw_config = bundle.extractfile(entry['Config']).read()
              archive_config = json.loads(raw_config)
          config_digest = 'sha256:' + hashlib.sha256(raw_config).hexdigest()
          assert archive_config['rootfs']['diff_ids'] == after['RootFS']['Layers']
          for field in ('Labels', 'Cmd', 'Entrypoint', 'Env', 'ExposedPorts', 'User', 'Healthcheck', 'WorkingDir'):
              assert archive_config['config'].get(field) == config.get(field), f'Archive config differs: {field}'
          receipt = {
              'schemaVersion': 1,
              'repository': 'dingyong221/H5AICustomerService',
              'sourceSha': source,
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'app': 'merchant-web',
              'pathMode': 'same_domain',
              'merchantBasePath': '/console',
              'createdAt': datetime.now(timezone.utc).isoformat(),
              'transportRun': {
                  'id': os.environ['GITHUB_RUN_ID'],
                  'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'workflowSha': os.environ['GITHUB_SHA'],
              },
              'image': {
                  'tag': tag,
                  'id': after['Id'],
                  'configDigest': config_digest,
                  'configBlobPath': entry['Config'],
                  'os': after['Os'],
                  'architecture': after['Architecture'],
                  'rootfsDiffIDs': after['RootFS']['Layers'],
                  'labels': config.get('Labels'),
                  'cmd': config.get('Cmd'),
                  'entrypoint': config.get('Entrypoint'),
                  'env': config.get('Env'),
                  'exposedPorts': config.get('ExposedPorts'),
                  'user': config.get('User'),
                  'healthcheck': config.get('Healthcheck'),
                  'workingDir': config.get('WorkingDir'),
              },
              'archive': {
                  'file': archive.name,
                  'sha256': 'sha256:' + digest.hexdigest(),
                  'bytes': archive_bytes,
                  'unpackedTarBytes': tar_bytes,
              },
              'verification': {
                  'packagedMerchantSmokePassed': True,
                  'saveRemoveLoadRoundTripPassed': True,
                  'archiveConfigAndRootfsMatched': True,
                  'businessCiVerified': False,
                  'provenanceAttestationVerified': False,
                  'realModelVerified': False,
                  'deployed': False,
              },
          }
          (output / 'delivery.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'sourceSha': source, 'configDigest': config_digest, 'archiveBytes': archive_bytes, 'unpackedTarBytes': tar_bytes}))
          PY

      - name: Upload only the archive and verified identity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merchant-management-image-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/merchant-menu-delivery/candidate-image.tar.gz
            ${{ runner.temp }}/merchant-menu-delivery/delivery.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
