name: Material parser OS isolation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies and build shared packages
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@h5cs/database --concurrency=1
      - name: Verify upload budgets, cancellation and original real formats
        run: |
          pnpm --filter @h5cs/merchant-web exec vitest run app/knowledge/material-parser.test.ts app/knowledge/material-parser-process.test.ts app/knowledge/material-routes.test.ts
          node --test scripts/quality/material-parser-deadline.test.mjs
      - name: Build the actual merchant image (no registry publication)
        run: docker build --file infra/docker/workspace.Dockerfile --target web --build-arg APP_KIND=web --build-arg APP_NAME=merchant-web --tag h5cs-material-parser:ci .
      - name: Verify independent Docker resources, denial and Web survival
        env:
          H5CS_PARSER_EVIDENCE: ${{ runner.temp }}/material-parser-evidence
        run: node scripts/quality/verify-material-parser-isolation.mjs h5cs-material-parser:ci
      - name: Upload only synthetic parser isolation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: material-parser-isolation-${{ github.sha }}
          path: ${{ runner.temp }}/material-parser-evidence
          if-no-files-found: ignore
          retention-days: 7
