name: Runtime execution control MySQL

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-control-mysql:
    name: Real MySQL scoped pause and observation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      COMPOSE_PROJECT_NAME: h5cs-runtime-stage3-${{ github.run_id }}-${{ github.run_attempt }}
      H5CS_MYSQL_DATABASE: h5cs_stage2_ci
      H5CS_MYSQL_USER: h5cs_stage2
      # These are disposable synthetic runner-local credentials.
      H5CS_MYSQL_PASSWORD: local-dev-ci-only
      H5CS_MYSQL_ROOT_PASSWORD: local-dev-root-only
      H5CS_STAGE2_MYSQL_URL: mysql://h5cs_stage2:local-dev-ci-only@127.0.0.1:3306/h5cs_stage2_ci
    steps:
      - name: Check out exact source and baseline history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pnpm 11
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts and database dependencies
        run: pnpm exec turbo run build --filter=@h5cs/database --concurrency=1
      - name: Verify on-demand inspection never executes a recovery action
        run: node --test scripts/runtime/watchdog.test.mjs
      - name: Start dedicated empty loopback MySQL
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml up -d --wait mysql
      - name: Verify persistent scopes, dispatch barriers, replay and honest metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/runtime-stage3-evidence"
          node packages/database/scripts/run-runtime-stage3-ci.mjs 2>&1 | tee "${{ runner.temp }}/runtime-stage3-evidence/mysql-tests.tap"
      - name: Upload bounded synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-stage3-mysql-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-stage3-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only this job's disposable MySQL and fixture volume
        if: always()
        run: docker compose --env-file .env.example --file infra/compose/docker-compose.dev.yml down --volumes
