name: H5 self-service acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/marketplace/**'
      - 'tests/marketplace/**'
      - 'playwright.marketplace.config.ts'
      - '.github/workflows/h5-self-service.yml'

permissions:
  contents: read

concurrency:
  group: h5-self-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-free-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      APP_ENV: test
      H5CS_A6_RUNTIME: docker-ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify additive legacy row preservation guards
        run: node --test scripts/marketplace/legacy-row-projection.test.mjs
      - name: Build real applications and workspace dependencies
        run: pnpm exec turbo run build --filter=@h5cs/api --filter=@h5cs/worker --concurrency=1 && pnpm --filter @h5cs/merchant-web exec next build --webpack && pnpm --filter @h5cs/consumer-h5 exec next build --webpack && NEXT_PUBLIC_OPS_BASE_PATH=/ops pnpm --filter @h5cs/ops-web exec next build --webpack
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=2048
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify migration, new and existing accounts, isolation, publication, desktop/mobile and restore
        run: node scripts/marketplace/run-local-stage2.mjs --run
      - name: Upload bounded synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-h5-free-acceptance
          retention-days: 7
          path: |
            artifacts/ai-supermarket-a6-stage2/run-*/*.json
            artifacts/ai-supermarket-a6-stage2/run-*/*.png
            artifacts/ai-supermarket-a6-stage2/run-*/failure.txt
            artifacts/ai-supermarket-a6-stage2/run-*/browser.log
            artifacts/ai-supermarket-a6-stage2/run-*/public-free-transactions.log
            artifacts/ai-supermarket-a6-stage2/run-*/transaction-tests.log
            artifacts/ai-supermarket-a6-stage2/run-*/merchant.log
            artifacts/ai-supermarket-a6-stage2/run-*/worker.log
            artifacts/ai-supermarket-a6-stage2/run-*/api.log
            artifacts/ai-supermarket-a6-stage2/run-*/consumer.log
