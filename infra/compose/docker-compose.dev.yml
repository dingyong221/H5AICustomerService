name: h5-ai-customer-service-dev

services:
  mysql:
    image: mysql:8.4.11
    restart: 'no'
    environment:
      MYSQL_DATABASE: ${H5CS_MYSQL_DATABASE:-h5_ai_customer_service_dev}
      MYSQL_PASSWORD: ${H5CS_MYSQL_PASSWORD:-local-dev-app-only}
      MYSQL_ROOT_PASSWORD: ${H5CS_MYSQL_ROOT_PASSWORD:-local-dev-root-only}
      MYSQL_USER: ${H5CS_MYSQL_USER:-h5cs_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    ports:
      - '127.0.0.1:${H5CS_MYSQL_PORT:-3306}:3306'
    volumes:
      - h5cs_mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - h5cs_dev_internal

  redis:
    image: redis:7.4.11-alpine
    restart: 'no'
    environment:
      REDIS_PASSWORD: ${H5CS_REDIS_PASSWORD:-local-dev-redis-only}
      TZ: Asia/Shanghai
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    ports:
      - '127.0.0.1:${H5CS_REDIS_PORT:-6379}:6379'
    volumes:
      - h5cs_redis_dev_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning --pass "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - h5cs_dev_internal

networks:
  h5cs_dev_internal:
    name: h5cs_dev_internal

volumes:
  h5cs_mysql_dev_data:
    name: h5cs_mysql_dev_data
  h5cs_redis_dev_data:
    name: h5cs_redis_dev_data
