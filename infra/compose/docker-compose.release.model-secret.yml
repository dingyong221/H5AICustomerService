# Include this override only after an approved provider key has been provisioned.
# The host file must be root-owned, group-readable by container uid/gid 1000,
# and inside a root-only directory. Never put its contents in a Compose env file.
services:
  worker:
    environment:
      MODEL_API_KEY_FILE: /run/secrets/h5cs-model-api-key
    volumes:
      - type: bind
        source: ${H5CS_MODEL_API_KEY_HOST_FILE:?set H5CS_MODEL_API_KEY_HOST_FILE to the approved key file}
        target: /run/secrets/h5cs-model-api-key
        read_only: true
