x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  networks:
    - app

x-web-defaults: &web-defaults
  <<: *runtime-defaults
  environment:
    HOSTNAME: 0.0.0.0
    NODE_ENV: production
    PORT: 3000
  mem_limit: 512m
  cpus: 0.35

services:
  api:
    <<: *runtime-defaults
    image: ${H5CS_API_IMAGE:?set H5CS_API_IMAGE to an immutable image digest}
    pull_policy: always
    env_file:
      - ${H5CS_RUNTIME_ENV_FILE:-/etc/h5-ai-customer-service/runtime.env}
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 4000
    ports:
      - 127.0.0.1:${H5CS_API_LOOPBACK_PORT:-14000}:4000
    mem_limit: 1280m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/livez').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *runtime-defaults
    image: ${H5CS_WORKER_IMAGE:?set H5CS_WORKER_IMAGE to an immutable image digest}
    pull_policy: always
    env_file:
      - ${H5CS_RUNTIME_ENV_FILE:-/etc/h5-ai-customer-service/runtime.env}
    environment:
      APP_ENV: production
      NODE_ENV: production
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3011
    ports:
      - 127.0.0.1:${H5CS_WORKER_HEALTH_LOOPBACK_PORT:-13011}:3011
    mem_limit: 1536m
    cpus: 0.55
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3011/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  merchant-web:
    <<: *web-defaults
    image: ${H5CS_MERCHANT_WEB_IMAGE:?set H5CS_MERCHANT_WEB_IMAGE to an immutable image digest}
    pull_policy: always
    env_file:
      - ${H5CS_MERCHANT_ENV_FILE:-/etc/h5-ai-customer-service/merchant-web.env}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      WORKER_READINESS_URL: http://worker:3011/readyz
    ports:
      - 127.0.0.1:${H5CS_MERCHANT_WEB_LOOPBACK_PORT:-13000}:3000

  consumer-h5:
    <<: *web-defaults
    image: ${H5CS_CONSUMER_H5_IMAGE:?set H5CS_CONSUMER_H5_IMAGE to an immutable image digest}
    pull_policy: always
    environment:
      CONSUMER_H5_ORIGIN: ${H5CS_PUBLIC_ORIGIN:?set H5CS_PUBLIC_ORIGIN to the canonical HTTPS origin}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - 127.0.0.1:${H5CS_CONSUMER_H5_LOOPBACK_PORT:-13001}:3000

  ops-web:
    <<: *web-defaults
    image: ${H5CS_OPS_WEB_IMAGE:?set H5CS_OPS_WEB_IMAGE to an immutable image digest}
    pull_policy: always
    env_file:
      - ${H5CS_OPS_ENV_FILE:-/etc/h5-ai-customer-service/ops-web.env}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      HEALTHCHECK_PATH: /login
    ports:
      - 127.0.0.1:${H5CS_OPS_WEB_LOOPBACK_PORT:-13002}:3000

networks:
  app:
    driver: bridge
