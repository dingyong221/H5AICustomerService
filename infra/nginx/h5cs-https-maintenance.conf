server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name h5cs.1rying.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://h5cs.1rying.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name h5cs.1rying.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/h5cs.1rying.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h5cs.1rying.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    if ($host != h5cs.1rying.com) {
        return 444;
    }

    access_log /var/log/nginx/h5-ai-customer-service.access.log;
    error_log /var/log/nginx/h5-ai-customer-service.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway","application":"not_deployed","domain":"h5cs.1rying.com"}\n';
    }

    location / {
        default_type application/json;
        add_header Retry-After "300" always;
        return 503 '{"status":"maintenance","message":"application_not_deployed"}\n';
    }
}
